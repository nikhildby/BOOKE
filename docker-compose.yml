services:
  postgres:
    image: postgres:15-alpine
    container_name: booke-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: booke
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: booke-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/booke?schema=public
      - JWT_SECRET=supersecretjwtkey
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: booke-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
